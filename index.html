<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background-color: #1a1a2e;
      color: white;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Text Styling */
    h1 {
      font-size: 3rem;
      opacity: 0;
      transition: opacity 2s ease-in;
      text-shadow: 0 0 10px #ff9a9e, 0 0 20px #fecfef;
    }
    
    .show-text h1 {
      opacity: 1;
    }

    /* Candle and Cake Styling */
    .cake {
      position: relative;
      margin-top: 50px;
    }

    .candle {
      width: 20px;
      height: 120px;
      background: linear-gradient(#fff, #f0f0f0);
      border-radius: 5px;
      position: relative;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    }

    .wick {
      width: 4px;
      height: 15px;
      background: #333;
      position: absolute;
      top: -10px;
      left: 8px;
    }

    /* Flame Animation */
    .flame {
      width: 20px;
      height: 40px;
      background: #ff9d00;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -45px;
      left: 0px;
      box-shadow: 0 0 20px #ff9d00, 0 0 40px #ff9d00, 0 0 60px #ff5100;
      animation: flicker 0.1s infinite alternate;
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
      transform-origin: bottom center;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
      100% { transform: scale(1.05) rotate(2deg); opacity: 1; }
    }

    /* When the candle is blown out */
    .blown-out .flame {
      opacity: 0;
      transform: scale(0);
    }

    /* Start Button */
    #startBtn {
      margin-top: 40px;
      padding: 10px 20px;
      font-size: 1.2rem;
      background: #ff9d00;
      color: #1a1a2e;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    
    #startBtn:hover {
      background: #ffb732;
    }
  </style>
</head>
<body>

  <div class="cake">
    <div class="candle">
      <div class="wick"></div>
      <div class="flame" id="flame"></div>
    </div>
  </div>

  <h1>Happy Birthday! 🎉</h1>

  <button id="startBtn">Click to Light Candle (Allow Mic)</button>

  <script>
    const startBtn = document.getElementById('startBtn');
    const body = document.body;
    let audioContext;
    let analyser;
    let microphone;

    // Browsers require user interaction to start audio processing
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none'; // Hide button after clicking
      
      try {
        // 1. Ask for microphone permission
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // 2. Set up Web Audio API
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        
        microphone.connect(analyser);
        analyser.fftSize = 256;
        
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        let blownOut = false;

        // 3. Constantly monitor the audio levels
        function listenToBlow() {
          if (blownOut) return; // Stop listening if already blown out
          
          analyser.getByteFrequencyData(dataArray);
          
          // Calculate the average volume
          let sum = 0;
          for (let i = 0; i < bufferLength; i++) {
            sum += dataArray[i];
          }
          let averageVolume = sum / bufferLength;

          // 4. Threshold for blowing (adjust this number if it's too hard/easy)
          // A heavy breath into a mic usually spikes the volume over 80-100
          if (averageVolume > 80) {
            blowOutCandle();
            blownOut = true;
          } else {
            // Keep listening
            requestAnimationFrame(listenToBlow);
          }
        }
        
        listenToBlow(); // Start the loop

      } catch (err) {
        alert("Microphone access is required to blow out the candle!");
        console.error(err);
        startBtn.style.display = 'block';
      }
    });

    // 5. The effect when the candle goes out
    function blowOutCandle() {
      // Hide flame via CSS class
      body.classList.add('blown-out');
      
      // Show birthday text
      body.classList.add('show-text');
      
      // Trigger confetti
      setTimeout(() => {
        confetti({
          particleCount: 150,
          spread: 80,
          origin: { y: 0.6 }
        });
      }, 500);
    }
  </script>
</body>
</html>
